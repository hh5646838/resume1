
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人简历与作品集</title>
  <link rel="stylesheet" href="style.css?v=8">
  <style>
    .lightbox-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.88);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      cursor: zoom-out;
    }
    .lightbox-overlay.active { display: flex; }
    .lightbox-overlay img {
      max-width: 92vw;
      max-height: 92vh;
      object-fit: contain;
      box-shadow: 0 4px 60px rgba(0,0,0,0.6);
    }
    .lightbox-close {
      position: absolute;
      top: 18px; right: 28px;
      color: #fff;
      font-size: 42px;
      font-weight: 300;
      cursor: pointer;
      background: none;
      border: none;
      line-height: 1;
      opacity: 0.8;
      transition: opacity 0.2s;
    }
    .lightbox-close:hover { opacity: 1; }
    .lightbox-caption {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: 14px;
      opacity: 0.8;
      text-align: center;
      max-width: 80vw;
    }
    .award-clickable { cursor: zoom-in; transition: filter 0.2s; }
    .award-clickable:hover { filter: brightness(1.05); }
  </style>
</head>
<body>
  <div id="app"></div>

  <button id="backToTop" class="back-to-top" aria-label="回到文首">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 14 12 8 18 14"></polyline></svg>
  </button>

  <script>
    // 加载配置数据并渲染页面
    async function init() {
      try {
        const response = await fetch('config.json?v=3');
        const config = await response.json();
        if (config.site && config.site.title) {
          document.title = config.site.title;
        }
        if (config.site && config.site.tagline) {
          let meta = document.querySelector('meta[name="description"]');
          if (!meta) {
            meta = document.createElement('meta');
            meta.name = 'description';
            document.head.appendChild(meta);
          }
          meta.content = config.site.tagline;
        }
        renderPage(config);
      } catch (error) {
        console.error('Failed to load config.json:', error);
        document.getElementById('app').innerHTML = '<p style="text-align:center;padding:40px;">加载数据失败，请确保 config.json 文件存在</p>';
      }
    }

    function renderPage(config) {
      const app = document.getElementById('app');
      app.innerHTML = `
        ${renderHeader(config.profile)}
        ${renderPortals(config.portals)}
        ${renderEducation(config.education)}
        ${renderSkills(config.skills)}
        ${renderWorkExperience(config.workExperience)}
        ${renderProjects(config.projects)}
        ${renderAwards(config.awards)}
        ${renderPapers(config.papers)}
        ${renderContact(config.contact)}
      `;
      initInteractions();
    }

    /* ===================== 交互逻辑 ===================== */

    // 初始化所有页面交互
    function initInteractions() {
      setupSkillAnimation();
      setupBackToTop();
      setupRubberBand();
      setupTouchParticles();
      setupAwardZoom();
    }

    // 技能专长：滚动进入视口时进度条从 0 到目标、数字从 0 涨到目标
    function setupSkillAnimation() {
      const sec = document.getElementById('skills-section');
      if (!sec) return;
      const rows = sec.querySelectorAll('.skill-row');

      // 无 IntersectionObserver 时直接落位，避免进度条卡在 0
      if (!('IntersectionObserver' in window)) {
        rows.forEach(row => {
          const lv = +row.dataset.level || 0;
          row.querySelector('.skill-fill').style.width = lv + '%';
          row.querySelector('.skill-num').textContent = lv;
        });
        return;
      }

      let done = false;
      const io = new IntersectionObserver((entries) => {
        entries.forEach(en => {
          if (en.isIntersecting && !done) {
            done = true;
            rows.forEach((row, i) => animateSkillRow(row, i));
            io.disconnect();
          }
        });
      }, { threshold: 0.35 });
      io.observe(sec);
    }

    function animateSkillRow(row, index) {
      const level = +row.dataset.level || 0;
      const fill = row.querySelector('.skill-fill');
      const num = row.querySelector('.skill-num');
      const delay = index * 130;        // 逐项错峰，节奏更自然
      const duration = 1100;            // 数字/进度统一时长，时间可控

      // 进度条：延迟后由 CSS transition 平滑生长
      setTimeout(() => { fill.style.width = level + '%'; }, delay);

      // 数字：从 0 缓动涨到目标
      let startTs = null;
      function tick(ts) {
        if (startTs === null) startTs = ts;
        const elapsed = ts - startTs;
        if (elapsed < delay) {
          num.textContent = '0';
          requestAnimationFrame(tick);
          return;
        }
        const t = Math.min(1, (elapsed - delay) / duration);
        const eased = 1 - Math.pow(1 - t, 3); // easeOutCubic
        num.textContent = Math.round(eased * level);
        if (t < 1) requestAnimationFrame(tick);
        else num.textContent = level;
      }
      requestAnimationFrame(tick);
    }

    // 极简「回到文首」按钮
    function setupBackToTop() {
      const btn = document.getElementById('backToTop');
      if (!btn) return;
      // 触屏设备（手机/平板）按方案 B：平时完全隐藏，仅滚动到页面底部那一屏才出现
      const isTouch = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
      const nearBottom = () => {
        const doc = document.documentElement;
        return (window.innerHeight + window.scrollY) >= (doc.scrollHeight - 80);
      };
      const onScroll = () => {
        if (isTouch) {
          if (nearBottom()) btn.classList.add('show');
          else btn.classList.remove('show');
        } else {
          // 桌面端：滚动超过 400px 即出现（维持原样）
          if (window.scrollY > 400) btn.classList.add('show');
          else btn.classList.remove('show');
        }
      };
      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', onScroll);
      onScroll();
      btn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }

    // 底部橡皮筋拉伸回弹（仅触屏，在页面最底继续下拉时）
    function setupRubberBand() {
      const page = document.getElementById('app');
      if (!page) return;
      // 仅触屏设备启用，桌面完全不挂监听，避免任何干扰
      if (!('ontouchstart' in window) && navigator.maxTouchPoints === 0) return;

      let startY = 0;
      let pullStartY = 0;        // 进入拉伸那一刻的手指 Y，橡皮筋从 0 平滑增长
      let pulling = false;       // 是否处于橡皮筋拉伸中
      let rubber = 0;
      const MAX = 170;           // 最大拉伸像素，防止拉过头
      const COEF = 0.5;          // 阻力系数，越大越"跟手"

      const atBottom = () => {
        const doc = document.documentElement;
        return (window.innerHeight + window.scrollY) >= (doc.scrollHeight - 4);
      };

      // 松手回弹：带轻微过冲的弹性曲线，快速弹回
      function snapBack() {
        if (!pulling) return;
        pulling = false;
        page.style.transition = 'transform 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.3)';
        page.style.transform = 'translateY(0)';
        setTimeout(() => {
          page.style.transition = '';
          page.style.transform = '';
        }, 580);
      }

      // 强制取消拉伸（手指回退/离开底部/手势中断），交还原生滚动
      function cancel() {
        if (!pulling) return;
        pulling = false;
        page.style.transition = 'none';
        page.style.transform = '';
      }

      window.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) return;
        startY = e.touches[0].clientY;
        pulling = false;
        rubber = 0;
        pullStartY = 0;
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (e.touches.length !== 1) return;
        const y = e.touches[0].clientY;

        if (pulling) {
          const pull = y - pullStartY;
          // 手指回退到起点之上，或已不在底部 → 立即释放，绝不拦截向上滑动
          if (pull <= 0 || !atBottom()) { cancel(); return; }
          rubber = Math.min(MAX, pull * COEF);
          page.style.transition = 'none';
          page.style.transform = 'translateY(' + rubber + 'px)';
          if (e.cancelable) e.preventDefault();
          return;
        }

        // 尚未拉伸：滚动过程中「动态到达底部」且「手指向下拉过阈值」才激活
        if (atBottom() && (y - startY) > 6) {
          pulling = true;
          pullStartY = y;
          rubber = 0;
          page.style.transition = 'none';
          page.style.transform = 'translateY(0)';
          if (e.cancelable) e.preventDefault();
        }
        // 其余情况完全交给原生滚动
      }, { passive: false });

      window.addEventListener('touchend', () => { if (pulling) snapBack(); });
      window.addEventListener('touchcancel', () => { if (pulling) cancel(); });
    }

    // 手机端：手指接触/滑动时，在触点留下一串彩色粒子拖尾（仅触屏，不挡交互）
    // 手机端：手指接触/滑动时，在触点留下一串彩色粒子拖尾（仅触屏，不挡交互）
    function setupTouchParticles() {
      const isTouch = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
      if (!isTouch) return;
      // 与简历配色协调的彩色序列，沿轨迹循环 → 一窜彩色粒子
      const palette = ['#E24B4A', '#EF9F27', '#1D9E75', '#378ADD', '#7F77DD'];
      let colorIdx = 0;
      let lastX = 0, lastY = 0;

      function spawn(x, y) {
        // 软上限，避免极端情况下粒子过多卡顿
        if (document.querySelectorAll('.touch-particle').length > 240) return;
        const size = 7 + Math.random() * 7;        // 7~14px，大小不一更像粒子
        const jx = (Math.random() - 0.5) * 14;      // 随机散布，形成"喷雾"感
        const jy = (Math.random() - 0.5) * 14;
        const color = palette[colorIdx % palette.length];
        colorIdx++;
        const p = document.createElement('div');
        p.className = 'touch-particle';
        p.style.left = (x + jx - size / 2) + 'px';
        p.style.top = (y + jy - size / 2) + 'px';
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.background = color;
        p.style.boxShadow = '0 0 9px ' + color;     // 彩色辉光，更亮眼
        document.body.appendChild(p);
        p.addEventListener('animationend', () => p.remove());
      }

      // 沿手指轨迹按距离插值补粒子：每移动约 7px 落一颗，快速滑动也连续成串
      function trailTo(x, y) {
        const dist = Math.hypot(x - lastX, y - lastY);
        if (dist < 7) return;
        const steps = Math.min(4, Math.floor(dist / 7));
        for (let i = 1; i <= steps; i++) {
          const ix = lastX + (x - lastX) * (i / steps);
          const iy = lastY + (y - lastY) * (i / steps);
          spawn(ix, iy);
        }
        lastX = x; lastY = y;
      }

      window.addEventListener('touchstart', (e) => {
        for (const t of e.touches) {
          lastX = t.clientX; lastY = t.clientY;
          spawn(t.clientX, t.clientY);
        }
      }, { passive: true });
      window.addEventListener('touchmove', (e) => {
        for (const t of e.touches) trailTo(t.clientX, t.clientY);
      }, { passive: true });
    }

    // 获奖荣誉：淘宝式悬浮局部放大（仅桌面 hover 生效，移动端不触发）
    function setupAwardZoom() {
      const isTouch = window.matchMedia('(hover: none)').matches;
      if (isTouch) return;
      const ZOOM = 2.5; // 放大倍数
      const RESULT_W = 260; // 放大面板宽度

      document.querySelectorAll('.award-zoom').forEach(z => {
        const img = z.querySelector('img');
        const lens = z.querySelector('.award-lens');
        const result = z.querySelector('.award-zoom-result');
        if (!img || !lens || !result) return;

        function move(e) {
          const rect = img.getBoundingClientRect();
          const iw = img.clientWidth, ih = img.clientHeight;
          if (!iw || !ih) return;
          let x = Math.max(0, Math.min(e.clientX - rect.left, iw));
          let y = Math.max(0, Math.min(e.clientY - rect.top, ih));

          const lensW = iw / ZOOM, lensH = ih / ZOOM;
          const lx = Math.max(0, Math.min(x - lensW / 2, iw - lensW));
          const ly = Math.max(0, Math.min(y - lensH / 2, ih - lensH));

          lens.style.width = lensW + 'px';
          lens.style.height = lensH + 'px';
          lens.style.left = lx + 'px';
          lens.style.top = ly + 'px';

          result.style.backgroundImage = `url('${img.src}')`;
          result.style.backgroundSize = (iw * ZOOM) + 'px ' + (ih * ZOOM) + 'px';
          result.style.backgroundPosition = `-${lx * ZOOM}px -${ly * ZOOM}px`;
        }

        z.addEventListener('mouseenter', () => {
          const iw = img.clientWidth, ih = img.clientHeight;
          if (!iw || !ih) return;
          result.style.height = (RESULT_W * ih / iw) + 'px';
          // 右侧空间不足则翻到左侧显示，避免溢出视口
          const rect = z.getBoundingClientRect();
          if (rect.right + RESULT_W + 16 > window.innerWidth) {
            result.style.left = 'auto';
            result.style.right = '105%';
          } else {
            result.style.left = '105%';
            result.style.right = 'auto';
          }
          lens.style.display = 'block';
          result.style.display = 'block';
        });
        z.addEventListener('mouseleave', () => {
          lens.style.display = 'none';
          result.style.display = 'none';
        });
        z.addEventListener('mousemove', move);
      });
    }

    function renderHeader(profile) {
      return `
        <header class="max-w-6xl px-8 py-20 md:py-32" style="margin-left:auto;margin-right:auto;">
          <div class="flex flex-col md:flex-row items-start gap-12 mb-12">
            <div class="flex-shrink-0 flex flex-col items-center">
              <div class="w-32 h-32 rounded-full overflow-hidden">
                <img src="${profile.avatar}" alt="头像" class="w-full h-full object-cover grayscale">
              </div>
            </div>
            <div class="flex-1">
              <p class="page-number mb-4">${profile.issueNumber}</p>
              <h1 class="font-didot text-6xl md:text-8xl italic font-bold mb-4 tracking-tight">${profile.englishName}</h1>
              <p class="text-xs uppercase tracking-widest mb-8">${profile.title}</p>
              <div class="contacts-list flex flex-wrap gap-x-8 gap-y-3 text-sm">
                ${profile.contacts.map(c => {
                  const icon = getContactIcon(c.type);
                  if (c.type === 'link') return `<a href="${c.url}" class="contact-item hover:text-red transition-colors">${icon}<span>${c.label}</span></a>`;
                  if (c.type === 'email') return `<span class="contact-item contact-email">${icon}<span>${c.label}</span></span>`;
                  return `<span class="contact-item">${icon}<span>${c.label}</span></span>`;
                }).join('')}
              </div>
            </div>
          </div>
        </header>
      `;
    }

    function getContactIcon(type) {
      const size = 14;
      if (type === 'link') {
        return `<svg class="contact-icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>`;
      }
      if (type === 'email') {
        return `<svg class="contact-icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>`;
      }
      // 默认：微信/聊天
      return `<svg class="contact-icon" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>`;
    }

    // 外链图标（与学术论文一致的「跳出」箭头）
    function getExternalIcon() {
      return `<svg class="inline-block ml-1 align-middle opacity-60" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>`;
    }

    function renderPortals(portals) {
      return `
        <section class="max-w-6xl px-8 py-12" style="margin-left:auto;margin-right:auto;">
          <p class="section-label mb-8">Personal Portals <span class="text-gray-400 font-normal normal-case tracking-normal lowercase ml-1">个人主页</span></p>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
            ${portals.map(p => `
              <a href="${p.url}" class="group block portal-link">
                <div class="bw-portal aspect-square bg-gray-100 mb-3 group-hover:bg-gray-200" style="${p.image ? `background-image:url('${p.image}');background-size:cover;background-position:center;` : ''}"></div>
                <p class="text-sm font-medium portal-name">${p.name}</p>
                <p class="text-xs text-gray-400 mt-1">${p.en}</p>
              </a>
            `).join('')}
          </div>
        </section>
      `;
    }

    function renderEducation(edu) {
      const eduName = edu.link
        ? `<a href="${edu.link}" target="_blank" rel="noopener noreferrer" class="edu-link hover:text-red transition-colors">${edu.nameCn}${getExternalIcon()}</a>`
        : edu.nameCn;
      return `
        <section class="max-w-6xl px-8 py-16" style="margin-left:auto;margin-right:auto;">
          <p class="section-label mb-8">Education <span class="text-gray-400 font-normal normal-case tracking-normal lowercase ml-1">教育经历</span></p>
          <div class="magazine-quote max-w-3xl">
            <div class="flex items-start gap-6">
              <div class="w-24 h-24 flex-shrink-0 flex items-center justify-center" style="${edu.logo ? `background-image:url('${edu.logo}');background-size:contain;background-repeat:no-repeat;background-position:center;` : ''}"></div>
              <div>
                <h3 class="font-didot text-2xl font-semibold mb-1 edu-name-heading">${eduName}</h3>
                <p class="text-sm italic mb-1">${edu.nameEn}</p>
                <p class="text-xs text-gray-500 mb-3">${edu.description}</p>
                <div class="flex gap-2">
                  ${edu.tags.map(t => `<span class="edu-tag px-2 py-1 border border-gray-300 text-xs">${t}</span>`).join('')}
                </div>
              </div>
            </div>
            <p class="page-number mt-4 text-right">${edu.pageNumber}</p>
          </div>
        </section>
      `;
    }

    function renderSkills(skills) {
      return `
        <section id="skills-section" class="max-w-6xl px-8 py-12" style="margin-left:auto;margin-right:auto;">
          <p class="section-label mb-8">Expertise <span class="text-gray-400 font-normal normal-case tracking-normal lowercase ml-1">技能专长</span></p>
          <div class="space-y-6" style="max-width:42rem;">
            ${skills.map(s => `
              <div class="skill-row" data-level="${s.level}">
                <div class="flex justify-between mb-2 text-sm">
                  <span class="skill-name">${s.name}</span>
                  <span class="skill-num font-didot italic">0</span>
                </div>
                <div class="skill-line"><div class="skill-fill" style="width:0%"></div></div>
              </div>
            `).join('')}
          </div>
        </section>
      `;
    }

    function renderWorkExperience(experiences) {
      return `
        <section class="max-w-6xl px-8 py-16" style="margin-left:auto;margin-right:auto;">
          <p class="section-label mb-8">Career Path <span class="text-gray-400 font-normal normal-case tracking-normal lowercase ml-1">工作经历</span></p>
          <div class="timeline-dotted space-y-10" style="max-width:48rem;">
            ${experiences.map(exp => `
              <div class="relative">
                <div class="timeline-dot"></div>
                <div>
                  <h3 class="font-didot text-xl font-semibold mb-1">${exp.title}</h3>
                  <p class="text-sm text-gray-500 mb-2">${exp.company} · ${exp.period}</p>
                  <p class="text-sm">${exp.description}</p>
                </div>
              </div>
            `).join('')}
          </div>
        </section>
      `;
    }

    function renderProjects(projects) {
      return `
        <section class="max-w-6xl px-8 py-12" style="margin-left:auto;margin-right:auto;">
          <p class="section-label mb-8">Selected Works <span class="text-gray-400 font-normal normal-case tracking-normal lowercase ml-1">项目经历</span></p>
          <div class="space-y-8" style="max-width:48rem;">
            ${projects.map(p => `
              <div class="border-l-2 border-red pl-6">
                <h3 class="font-didot text-lg font-semibold mb-1">${p.title}</h3>
                <p class="text-xs text-gray-500 mb-2">${p.period}</p>
                <p class="text-sm">${p.description}</p>
              </div>
            `).join('')}
          </div>
        </section>
      `;
    }

    function renderAwards(awards) {
      return `
        <section class="max-w-6xl px-8 py-16" style="margin-left:auto;margin-right:auto;">
          <p class="section-label mb-8">Recognition <span class="text-gray-400 font-normal normal-case tracking-normal lowercase ml-1">获奖荣誉</span></p>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
            ${awards.map(a => `
              <div class="relative">
                <div class="award-zoom">
                  <img src="${a.image}" alt="${a.name}" class="bw-img w-full ${a.aspect === 'square' ? 'aspect-square' : 'aspect-[4/5]'} object-cover award-clickable" onclick="openLightbox('${a.image}', '${a.name.replace(/'/g, "\\'").replace(/"/g, '&quot;')}')">
                  <div class="award-lens"></div>
                  <div class="award-zoom-result"></div>
                </div>
                <span class="award-badge">${a.badge}</span>
                <p class="text-xs mt-3 text-center font-medium">${a.name}</p>
              </div>
            `).join('')}
          </div>
        </section>
      `;
    }

    function renderPapers(papers) {
      const externalIcon = getExternalIcon();
      return `
        <section class="max-w-6xl px-8 py-12" style="margin-left:auto;margin-right:auto;">
          <p class="section-label mb-8">Publications <span class="text-gray-400 font-normal normal-case tracking-normal lowercase ml-1">学术论文</span></p>
          <div class="space-y-6" style="max-width:48rem;">
            ${papers.map(p => `
              <div class="border-l-2 border-red pl-4">
                <a href="${p.url}" target="_blank" rel="noopener noreferrer" class="font-didot text-lg font-medium hover:text-red transition-colors">${p.title}${externalIcon}</a>
                <p class="text-sm text-gray-500 mt-1">${p.journal} · ${p.type} · ${p.date}</p>
              </div>
            `).join('')}
          </div>
        </section>
      `;
    }

    function renderContact(contact) {
      return `
        <section class="max-w-6xl px-8 py-20 border-t border-gray-200 mt-12" style="margin-left:auto;margin-right:auto;">
          <p class="section-label mb-8">Get in Touch <span class="text-gray-400 font-normal normal-case tracking-normal lowercase ml-1">联系方式</span></p>
          <div class="space-y-2 text-sm">
            <p><span class="font-medium">Tel:</span> ${contact.tel}</p>
            <p><span class="font-medium">Email:</span> ${contact.email}</p>
            <p><span class="font-medium">WeChat:</span> ${contact.wechat}</p>
            <p><span class="font-medium">Address:</span> ${contact.address}</p>
          </div>
          <p class="page-number mt-12 text-center">${contact.copyright}</p>
        </section>
      `;
    }

    // Lightbox 大图查看
    function openLightbox(src, caption) {
      const overlay = document.getElementById('lightboxOverlay');
      const img = overlay.querySelector('img');
      const cap = overlay.querySelector('.lightbox-caption');
      img.src = src;
      cap.textContent = caption || '';
      overlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      document.getElementById('lightboxOverlay').classList.remove('active');
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeLightbox();
    });

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', init);
  </script>

  <div id="lightboxOverlay" class="lightbox-overlay" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
    <img src="" alt="" onclick="event.stopPropagation()">
    <p class="lightbox-caption"></p>
  </div>
</body>
</html>
